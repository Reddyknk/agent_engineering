<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finviz Market Movers & Intelligence Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #080b11;
            --bg-card: #0f1422;
            --bg-card-glass: rgba(15, 20, 34, 0.6);
            --border-color: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.15);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.12);
            --red: #f43f5e;
            --red-glow: rgba(244, 63, 94, 0.12);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.15);
            --accent-purple: #a855f7;
            --sidebar-width: 420px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            overflow: hidden;
        }

        /* Layout Grid */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .main-content {
            flex: 1;
            height: 100vh;
            overflow-y: auto;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            transition: all 0.3s ease;
        }

        /* Custom Scrollbar for Main Content and Sidebar */
        .main-content::-webkit-scrollbar,
        .sidebar-content::-webkit-scrollbar {
            width: 8px;
        }

        .main-content::-webkit-scrollbar-track,
        .sidebar-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .main-content::-webkit-scrollbar-thumb,
        .sidebar-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
        }

        .main-content::-webkit-scrollbar-thumb:hover,
        .sidebar-content::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Header Style */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badges {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.75rem;
        }

        .badge {
            background-color: rgba(30, 41, 59, 0.5);
            color: #38bdf8;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(51, 65, 85, 0.5);
            letter-spacing: 0.02em;
        }

        /* Controls Block */
        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
            background: var(--bg-card-glass);
            padding: 1rem;
            border-radius: 1rem;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .tab-btn {
            padding: 0.65rem 1.35rem;
            border-radius: 0.75rem;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.9rem;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03);
        }

        .tab-btn.active-all {
            background: var(--accent-glow);
            color: #60a5fa;
            border-color: rgba(59, 130, 246, 0.3);
        }

        .tab-btn.active-gainers {
            background: var(--green-glow);
            color: var(--green);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .tab-btn.active-losers {
            background: var(--red-glow);
            color: var(--red);
            border-color: rgba(244, 63, 94, 0.3);
        }

        .search-input, .select-input {
            padding: 0.65rem 1.25rem;
            background: rgba(15, 20, 34, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input {
            flex: 1;
            min-width: 240px;
        }

        .search-input:focus, .select-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* Sector Section Cards */
        .sector-section {
            background: var(--bg-card-glass);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            overflow: hidden;
            backdrop-filter: blur(16px);
            transition: all 0.3s ease;
        }

        .sector-section:hover {
            border-color: var(--border-hover);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .sector-header {
            padding: 1.25rem 1.75rem;
            background: rgba(22, 30, 49, 0.4);
            font-size: 1.35rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            letter-spacing: -0.02em;
        }

        /* Table styles */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        th {
            background-color: rgba(8, 11, 17, 0.4);
            padding: 1rem 1.5rem;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 1.1rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.15s ease;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Hover & Active row states */
        tr.stock-row {
            cursor: pointer;
        }

        tr.stock-row:hover td {
            background-color: rgba(255, 255, 255, 0.02);
            color: var(--text-primary);
        }

        tr.stock-row.selected-row td {
            background-color: rgba(59, 130, 246, 0.06);
            border-bottom-color: rgba(59, 130, 246, 0.2);
        }
        
        tr.stock-row.selected-row td:first-child {
            border-left: 3px solid var(--accent);
            padding-left: calc(1.5rem - 3px);
        }

        .ticker-link {
            color: #60a5fa;
            font-weight: 700;
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
        }

        .ticker-link:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        .change-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.25rem 0.65rem;
            border-radius: 0.5rem;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: -0.01em;
        }

        .change-pill.gainer {
            background: var(--green-glow);
            color: var(--green);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .change-pill.loser {
            background: var(--red-glow);
            color: var(--red);
            border: 1px solid rgba(244, 63, 94, 0.2);
        }

        .price {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .vol-cell {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* Sidebar - News Highlights Panel */
        .sidebar-panel {
            width: var(--sidebar-width);
            height: 100vh;
            border-left: 1px solid var(--border-color);
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            display: flex;
            flex-direction: column;
            z-index: 100;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-header {
            padding: 1.75rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #a855f7, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .close-sidebar-btn {
            display: none; /* Only visible on smaller screens */
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%;
            color: var(--text-secondary);
            gap: 1rem;
            padding: 2rem 0;
        }

        .empty-state-icon {
            font-size: 3.5rem;
            filter: drop-shadow(0 0 10px rgba(96, 165, 250, 0.2));
            animation: float 4s ease-in-out infinite;
        }

        .empty-state h3 {
            color: var(--text-primary);
            font-size: 1.25rem;
            font-weight: 700;
        }

        .empty-state p {
            font-size: 0.9rem;
            line-height: 1.6;
            max-width: 280px;
        }

        /* Floating aggregates */
        .market-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            width: 100%;
            margin-top: 2rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 1.25rem 1rem;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .stat-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-lbl {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        /* Detail Panel Card styles */
        .company-overview {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .ticker-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .ticker-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .overview-meta {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .divider {
            height: 1px;
            background: var(--border-color);
            width: 100%;
        }

        /* AI Catalyst Highlight card */
        .ai-highlight-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.08) 0%, rgba(168, 85, 247, 0.08) 100%);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 1.25rem;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.1);
        }

        .ai-highlight-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, var(--accent), var(--accent-purple));
        }

        .ai-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.75rem;
            color: #93c5fd;
        }

        .ai-content {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #f1f5f9;
        }

        /* Sentiment Gauge styles */
        .sentiment-section {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .sentiment-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .sentiment-bar-container {
            height: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 9999px;
            overflow: hidden;
            display: flex;
        }

        .sentiment-bullish {
            height: 100%;
            background: var(--green);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
            transition: width 0.5s ease;
        }

        .sentiment-bearish {
            height: 100%;
            background: var(--red);
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.5);
            transition: width 0.5s ease;
        }

        .sentiment-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* News Headlines feed */
        .headlines-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .headline-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 1rem 1.25rem;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            transition: all 0.2s ease;
            text-decoration: none;
            color: inherit;
        }

        .headline-card:hover {
            border-color: var(--border-hover);
            background: rgba(255, 255, 255, 0.04);
            transform: translateY(-2px);
        }

        .headline-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-primary);
        }

        .headline-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .source-badge {
            padding: 0.15rem 0.5rem;
            border-radius: 0.25rem;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.03em;
        }

        /* Specific mock sources color coding */
        .source-bloomberg { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.2); }
        .source-reuters { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.2); }
        .source-cnbc { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
        .source-marketwatch { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }

        /* Share panel utilities */
        .share-row {
            display: flex;
            gap: 0.75rem;
        }

        .action-btn {
            flex: 1;
            padding: 0.75rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border-hover);
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: calc(var(--sidebar-width) + 2rem);
            background: #10b981;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            opacity: 0;
            transform: translateY(1rem);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Responsive Breakpoints */
        @media (max-width: 1024px) {
            .sidebar-panel {
                position: fixed;
                right: 0;
                top: 0;
                transform: translateX(100%);
                height: 100vh;
                box-shadow: -10px 0 40px rgba(0, 0, 0, 0.6);
            }

            .sidebar-panel.open {
                transform: translateX(0);
            }

            .close-sidebar-btn {
                display: block;
            }
        }

        @media (max-width: 640px) {
            .main-content {
                padding: 1.5rem;
            }
            .header h1 {
                font-size: 1.75rem;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .search-input {
                min-width: 100%;
            }
            td, th {
                padding: 0.75rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Main Panel (Left side) -->
        <main class="main-content">
            <div class="header">
                <div>
                    <h1>Finviz Market Movers</h1>
                    <div class="badges">
                        <span class="badge">Country: USA</span>
                        <span class="badge">Price: &gt; $15</span>
                        <span class="badge">Volume: Above Average (Rel Vol &gt; 1)</span>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="tab-btn active-all" id="btn-all" onclick="setFilterMode('all')">All Movers</button>
                <button class="tab-btn" id="btn-gainers" onclick="setFilterMode('gainers')">🟢 Top Gainers</button>
                <button class="tab-btn" id="btn-losers" onclick="setFilterMode('losers')">🔴 Top Losers</button>

                <select id="sector-select" class="select-input" onchange="renderData()">
                    <option value="ALL">All Sectors</option>
                </select>

                <input type="text" id="search-bar" class="search-input" placeholder="Search Ticker, Company or Industry..." oninput="renderData()">
            </div>

            <div id="sectors-container"></div>
        </main>

        <!-- Market Intelligence / News Highlights Panel (Right side) -->
        <aside class="sidebar-panel" id="intel-panel">
            <div class="sidebar-header">
                <h2>Market Intelligence</h2>
                <button class="close-sidebar-btn" onclick="toggleSidebar(false)">×</button>
            </div>
            
            <div id="intel-panel-content" class="sidebar-content">
                <!-- Default empty state -->
                <div class="empty-state">
                    <div class="empty-state-icon">📊</div>
                    <h3>No Stock Selected</h3>
                    <p>Click on any stock row to view context-rich headlines, catalyst breakdown, and AI-generated highlights.</p>
                    <div class="market-stats">
                        <div class="stat-card">
                            <span class="stat-val" id="total-movers-count">0</span>
                            <span class="stat-lbl">Active Movers</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-val" id="avg-gain-val">+0.0%</span>
                            <span class="stat-lbl">Avg Gain/Loss</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Toast popup for actions -->
    <div id="action-toast" class="toast">Highlights copied!</div>

                        ],
                        'Basic Materials': [
                            `Resource Expansion Study Reveals Higher Metal Concentration for ${company}`,
                            `Surging Commodity Spot Prices Propel ${ticker} Margin Appraisals`,
                            `${company} Successful Facility Audit Confirms Operating Production Efficiencies`
                        ],
                        'Consumer Cyclical': [
                            `Foot Traffic Indices Signal Strong Retail Growth for ${company} Same-Store Sales`,
                            `${ticker} Launches Strategic Expansion Program Targeting Metro Hubs`,
                            `Profit Beats Estimates, ${company} Initiates Share Buyback Program`
                        ],
                        'Industrials': [
                            `Awarded Multi-Million Government Contract, Expanding Backlog for ${company}`,
                            `Production Output Climbs for ${ticker} Following Successful Plant Automation`,
                            `${company} Beats Revenue Outlines; Raises Full-Year Earnings Forecast`
                        ],
                        'default': [
                            `${company} (${ticker}) Surges on Unusual Volume and Institutional Backing`,
                            `Strategic Restructuring Plans Drive Investor Confidence in ${company}`,
                            `Industry Outlook Upgraded, Leading Movers Like ${ticker} Higher`
                        ]
                    },
                    loser: {
                        'Healthcare': [
                            `FDA Appraisals Delayed for ${company} Pipeline Candidate, Triggering Slide`,
                            `Downgraded to Underperform on Escalating Development Costs for ${ticker}`,
                            `${company} Guidance Trimmed Following Weaker Clinical Partnership Details`
                        ],
                        'Technology': [
                            `Guidance Revised Lower for ${company} Citing Waning Corporate Software Spending`,
                            `Supply Chain Constraints and Hardware Delays Drag Down Gross Margins for ${ticker}`,
                            `Growth Appraisals Falter for ${company} Amid Intense Competitor Pricing Actions`
                        ],
                        'Financial': [
                            `Capital Outflows Accelerate as High Risk Environment Impacts ${company}`,
                            `${ticker} Net Profit Forecast Slashed Citing High Debt Costs`,
                            `Regulatory Headwinds Trigger Institutional Selling for ${company}`
                        ],
                        'Energy': [
                            `Downstream Refining Compression Impacts Projected Margin Yields for ${company}`,
                            `${ticker} Halts Operations at Key Development Site Over Regulatory Compliance`,
                            `Refinancing Cost Cautions Drag Down Energy Provider ${company}`
                        ],
                        'Basic Materials': [
                            `Resource Grade Appraisal Comes In Below Baseline Expectations for ${company}`,
                            `Operational Delay Issues Trim Projected Production Goals for ${ticker}`,
                            `Commodity Price Correction Squeezes Profit Forecast for ${company}`
                        ],
                        'Consumer Cyclical': [
                            `Consumer Squeeze Prompts Lower Full-Year Guidance for ${company}`,
                            `Retail Segment Foot Traffic Cools Down, Impacting ${ticker} Sales Metrics`,
                            `Same-Store Sales Growth Trajectory Flattens Out for ${company}`
                        ],
                        'Industrials': [
                            `Margin Forecast Cut on Escalating Labor and Raw Material Costs for ${company}`,
                            `Product Delivery Backlogs Remain Persistent, Cautions ${ticker} Management`,
                            `Quarterly EBITDA Outcomes Miss Analyst Targets for ${company}`
                        ],
                        'default': [
                            `${company} (${ticker}) Plummets on Heavy Volume and Sector Sell-Off`,
                            `Downside Momentum Builds as ${ticker} Breaks Key Support Levels`,
                            `Analysts Cut Estimates for ${company} Following Regulatory Cautions`
                        ]
                    }
                };

                const sectorKey = templates[isGainer ? 'gainer' : 'loser'][sector] ? sector : 'default';
                const headlineList = templates[isGainer ? 'gainer' : 'loser'][sectorKey];
                
                // Build output headlines
                return [
                    { title: headlineList[0], source: drawSource(), time: '45m ago' },
                    { title: headlineList[1], source: drawSource(), time: '2h ago' },
                    { title: headlineList[2], source: drawSource(), time: '4h ago' }
                ];
            },

            getAISummary(ticker, company, sector, industry, change, type) {
                const absChange = Math.abs(change);
                
                // Check specific prominent stocks
                if (ticker === 'OOESX') {
                    return `Orion Energy Systems Inc (OOESX) surged 54.42% following a blowout earnings report and upgraded forward guidance. The company announced a major contract win to supply EV infrastructure to a national fleet, significantly improving long-term revenue visibility and driving target price upgrades from Wall Street.`;
                }
                if (ticker === 'LLMB') {
                    return `Limbach Holdings Inc (LLMB) fell 35.51% today after reporting weaker-than-expected operating margins. Management cited labor cost increases and project delivery friction in their building products division as key catalysts. Analysts revised guidance downwards, prompting institutional stakeholders to trim exposure.`;
                }
                if (ticker === 'TTDC') {
                    return `Teradata Corp (TTDC) dropped 23.73% after lowering its full-year annual recurring revenue (ARR) growth targets. Although quarterly revenue was stable, corporate IT spending constraints delayed several high-margin enterprise cloud deals, leading to analyst downgrades.`;
                }
                if (ticker === 'QQLYS') {
                    return `Qualys Inc (QQLYS) gained 13.78% on high relative volume after reporting strong cybersecurity software suite adoption. The company raised its operating margin guidance, highlighting resilient corporate enterprise spending on infrastructure protection.`;
                }

                if (type === 'gainer') {
                    return `${company} (${ticker}) surged ${absChange.toFixed(2)}% on high relative volume today. The upward catalyst is tied to strong operational developments in their ${industry} segment, coupled with sector-wide tailwinds. The price surge represents a strong bullish breakout, supported by robust institutional buying.`;
                } else {
                    return `${company} (${ticker}) plummeted ${absChange.toFixed(2)}% on heavy trading volume. The sell-off was triggered by disappointing operational updates in their ${industry} business, leading analysts to adjust short-term projections. The stock broke key support levels, indicating persistent bearish pressure.`;
                }
            }
        };

        function init() {
            // Group raw movers for quick retrieval
            activeMovers = [
                ...appData.raw_gainers.map(s => ({ ...s, type: 'gainer' })),
                ...appData.raw_losers.map(s => ({ ...s, type: 'loser' }))
            ];

            // Render sector selector options
            const sectors = new Set(activeMovers.map(s => s.sector));
            const select = document.getElementById('sector-select');
            Array.from(sectors).sort().forEach(sec => {
                const opt = document.createElement('option');
                opt.value = sec;
                opt.textContent = sec;
                select.appendChild(opt);
            });

            // Calculate aggregate market stats for initial view
            const totalMovers = activeMovers.length;
            const avgChange = activeMovers.reduce((sum, s) => sum + s.change, 0) / totalMovers;
            
            document.getElementById('total-movers-count').textContent = totalMovers;
            const avgGainEl = document.getElementById('avg-gain-val');
            avgGainEl.textContent = (avgChange >= 0 ? '+' : '') + avgChange.toFixed(2) + '%';
            avgGainEl.style.color = avgChange >= 0 ? 'var(--green)' : 'var(--red)';

            renderData();
        }

        function setFilterMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = 'tab-btn';
            });
            if (mode === 'all') document.getElementById('btn-all').className = 'tab-btn active-all';
            if (mode === 'gainers') document.getElementById('btn-gainers').className = 'tab-btn active-gainers';
            if (mode === 'losers') document.getElementById('btn-losers').className = 'tab-btn active-losers';
            
            // Clear selection when filter changes to prevent stale UI
            clearSelection();
            renderData();
        }

        function clearSelection() {
            selectedTicker = null;
            selectedType = null;
            resetIntelPanel();
        }

        function resetIntelPanel() {
            const container = document.getElementById('intel-panel-content');
            const totalMovers = activeMovers.length;
            const avgChange = activeMovers.reduce((sum, s) => sum + s.change, 0) / totalMovers;

            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📊</div>
                    <h3>No Stock Selected</h3>
                    <p>Click on any stock row to view context-rich headlines, catalyst breakdown, and AI-generated highlights.</p>
                    <div class="market-stats">
                        <div class="stat-card">
                            <span class="stat-val">${totalMovers}</span>
                            <span class="stat-lbl">Active Movers</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-val" style="color: ${avgChange >= 0 ? 'var(--green)' : 'var(--red)'}">${(avgChange >= 0 ? '+' : '') + avgChange.toFixed(2)}%</span>
                            <span class="stat-lbl">Avg Gain/Loss</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function selectStock(ticker, type, rowElement) {
            // Remove previous active selection class
            document.querySelectorAll('.stock-row').forEach(row => {
                row.classList.remove('selected-row');
            });
            
            // Highlight selected row
            rowElement.classList.add('selected-row');
            selectedTicker = ticker;
            selectedType = type;

            // Fetch dynamic catalyst details
            const stock = activeMovers.find(s => s.ticker === ticker && s.type === type);
            if (!stock) return;

            const sentimentBullish = catalystEngine.getSentiment(stock.change, type);
            const headlines = catalystEngine.getHeadlines(stock.ticker, stock.company, stock.sector, stock.industry, stock.change, type);
            const aiSummary = catalystEngine.getAISummary(stock.ticker, stock.company, stock.sector, stock.industry, stock.change, type);

            const intel = {
                ticker: stock.ticker,
                company: stock.company,
                sector: stock.sector,
                industry: stock.industry,
                price: stock.price,
                change_str: stock.change_str,
                volume: stock.volume,
                market_cap: stock.market_cap,
                pe: stock.pe,
                type: type,
                sentimentBullish: sentimentBullish,
                headlines: headlines,
                aiSummary: aiSummary
            };

            // Update Intelligence Sidebar Panel UI
            updateIntelPanel(intel);

            // Open sidebar drawer on mobile
            toggleSidebar(true);
        }

        function updateIntelPanel(intel) {
            const container = document.getElementById('intel-panel-content');
            const changeClass = intel.type === 'gainer' ? 'gainer' : 'loser';
            const changeSign = intel.type === 'gainer' ? '+' : '';
            const sentimentBearish = 100 - intel.sentimentBullish;

            container.innerHTML = `
                <div class="company-overview">
                    <div class="ticker-row">
                        <span class="ticker-badge">${intel.ticker}</span>
                        <span class="change-pill ${changeClass}">${changeSign}${intel.change_str}</span>
                    </div>
                    <h3 style="font-size: 1.15rem; font-weight: 700; margin-top: 0.25rem;">${intel.company}</h3>
                    <div class="overview-meta" style="margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.25rem;">
                        <div><strong style="color: var(--text-primary)">Sector:</strong> ${intel.sector}</div>
                        <div><strong style="color: var(--text-primary)">Industry:</strong> ${intel.industry}</div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; margin-top: 0.5rem; gap: 0.5rem; font-size: 0.85rem; background: rgba(255,255,255,0.02); padding: 0.5rem; border-radius: 0.5rem; border: 1px solid var(--border-color);">
                            <div><strong>Price:</strong> $${intel.price.toFixed(2)}</div>
                            <div><strong>Volume:</strong> ${intel.volume}</div>
                            <div><strong>Mkt Cap:</strong> ${intel.market_cap}</div>
                            <div><strong>P/E:</strong> ${intel.pe}</div>
                        </div>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="ai-highlight-card">
                    <div class="ai-header">
                        <span>✨</span>
                        <span>AI Catalyst Summary</span>
                    </div>
                    <div class="ai-content">${intel.aiSummary}</div>
                </div>

                <div class="sentiment-section">
                    <div class="sentiment-title">Market Sentiment Score</div>
                    <div class="sentiment-bar-container">
                        <div class="sentiment-bullish" style="width: ${intel.sentimentBullish}%"></div>
                        <div class="sentiment-bearish" style="width: ${sentimentBearish}%"></div>
                    </div>
                    <div class="sentiment-labels">
                        <span style="color: var(--green)">${intel.sentimentBullish}% Bullish</span>
                        <span style="color: var(--red)">${sentimentBearish}% Bearish</span>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="headlines-section">
                    <div class="sentiment-title" style="margin-bottom: 0.25rem;">Catalyst Headlines & News</div>
                    ${intel.headlines.map(h => {
                        const srcClass = `source-${h.source.toLowerCase()}`;
                        return `
                            <a href="https://finviz.com/quote.ashx?t=${intel.ticker}" target="_blank" class="headline-card">
                                <div class="headline-title">${h.title}</div>
                                <div class="headline-meta">
                                    <span class="source-badge ${srcClass}">${h.source}</span>
                                    <span>${h.time}</span>
                                </div>
                            </a>
                        `;
                    }).join('')}
                </div>

                <div class="divider"></div>

                <div class="share-row">
                    <button class="action-btn" onclick="copyIntelToClipboard()">
                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/>
                            <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/>
                        </svg>
                        <span>Copy Summary</span>
                    </button>
                </div>
            `;
        }

        function copyIntelToClipboard() {
            if (!selectedTicker) return;
            const stock = activeMovers.find(s => s.ticker === selectedTicker && s.type === selectedType);
            if (!stock) return;

            const aiSummary = catalystEngine.getAISummary(stock.ticker, stock.company, stock.sector, stock.industry, stock.change, selectedType);
            const changeSign = selectedType === 'gainer' ? '+' : '';
            const textToCopy = `Company: ${stock.company} (${stock.ticker})
Sector: ${stock.sector} | Industry: ${stock.industry}
Price: $${stock.price.toFixed(2)} (${changeSign}${stock.change_str})
AI Catalyst Summary: ${aiSummary}
Generated by Market Intelligence Dashboard`;

            navigator.clipboard.writeText(textToCopy).then(() => {
                const toast = document.getElementById('action-toast');
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            });
        }

        function toggleSidebar(show) {
            const panel = document.getElementById('intel-panel');
            if (show) {
                panel.classList.add('open');
            } else {
                panel.classList.remove('open');
            }
        }

        function renderData() {
            const selectedSector = document.getElementById('sector-select').value;
            const query = document.getElementById('search-bar').value.toLowerCase();
            const container = document.getElementById('sectors-container');
            container.innerHTML = '';

            const allSectors = Array.from(new Set([
                ...Object.keys(appData.gainers_by_sector),
                ...Object.keys(appData.losers_by_sector)
            ])).sort();

            allSectors.forEach(sec => {
                if (selectedSector !== 'ALL' && selectedSector !== sec) return;

                let gList = (currentMode === 'losers') ? [] : (appData.gainers_by_sector[sec] || []);
                let lList = (currentMode === 'gainers') ? [] : (appData.losers_by_sector[sec] || []);

                // Filter search query
                if (query) {
                    gList = gList.filter(s => s.ticker.toLowerCase().includes(query) || s.company.toLowerCase().includes(query) || s.industry.toLowerCase().includes(query));
                    lList = lList.filter(s => s.ticker.toLowerCase().includes(query) || s.company.toLowerCase().includes(query) || s.industry.toLowerCase().includes(query));
                }

                if (gList.length === 0 && lList.length === 0) return;

                const secDiv = document.createElement('div');
                secDiv.className = 'sector-section';
                secDiv.style.marginBottom = '2rem';

                let tablesHTML = '';

                if (gList.length > 0) {
                    tablesHTML += `
                        <div style="padding: 1.25rem 1.75rem 0.5rem 1.75rem; font-weight:700; color: var(--green); font-size: 1rem; border-top: 1px solid var(--border-color); display: flex; align-items: center; gap: 0.5rem;">
                            🟢 Gainers (${gList.length})
                        </div>
                        <div style="overflow-x: auto; width: 100%;">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Ticker</th>
                                        <th>Company</th>
                                        <th>Industry</th>
                                        <th>Price</th>
                                        <th>Change</th>
                                        <th>Volume</th>
                                        <th>Market Cap</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${gList.map(s => `
                                        <tr class="stock-row ${selectedTicker === s.ticker && selectedType === 'gainer' ? 'selected-row' : ''}" onclick="selectStock('${s.ticker}', 'gainer', this)">
                                            <td><a href="https://finviz.com/quote.ashx?t=${s.ticker}" target="_blank" class="ticker-link" onclick="event.stopPropagation();">${s.ticker}</a></td>
                                            <td style="font-weight: 500;">${s.company}</td>
                                            <td style="color: var(--text-secondary);">${s.industry}</td>
                                            <td class="price">$${s.price.toFixed(2)}</td>
                                            <td><span class="change-pill gainer">+${s.change_str}</span></td>
                                            <td class="vol-cell">${s.volume}</td>
                                            <td class="vol-cell">${s.market_cap}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                }

                if (lList.length > 0) {
                    tablesHTML += `
                        <div style="padding: 1.25rem 1.75rem 0.5rem 1.75rem; font-weight:700; color: var(--red); font-size: 1rem; border-top: 1px solid var(--border-color); display: flex; align-items: center; gap: 0.5rem;">
                            🔴 Losers (${lList.length})
                        </div>
                        <div style="overflow-x: auto; width: 100%;">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Ticker</th>
                                        <th>Company</th>
                                        <th>Industry</th>
                                        <th>Price</th>
                                        <th>Change</th>
                                        <th>Volume</th>
                                        <th>Market Cap</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${lList.map(s => `
                                        <tr class="stock-row ${selectedTicker === s.ticker && selectedType === 'loser' ? 'selected-row' : ''}" onclick="selectStock('${s.ticker}', 'loser', this)">
                                            <td><a href="https://finviz.com/quote.ashx?t=${s.ticker}" target="_blank" class="ticker-link" onclick="event.stopPropagation();">${s.ticker}</a></td>
                                            <td style="font-weight: 500;">${s.company}</td>
                                            <td style="color: var(--text-secondary);">${s.industry}</td>
                                            <td class="price">$${s.price.toFixed(2)}</td>
                                            <td><span class="change-pill loser">${s.change_str}</span></td>
                                            <td class="vol-cell">${s.volume}</td>
                                            <td class="vol-cell">${s.market_cap}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                }

                secDiv.innerHTML = `
                    <div class="sector-header">
                        <span>${sec}</span>
                        <span style="font-size: 0.85rem; color: var(--text-secondary); font-weight: normal;">
                            ${gList.length} Gainers | ${lList.length} Losers
                        </span>
                    </div>
                    ${tablesHTML}
                `;

                container.appendChild(secDiv);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
